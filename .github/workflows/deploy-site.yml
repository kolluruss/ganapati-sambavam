name: Rebuild and deploy reading site

# Every push to main rebuilds ganapati-sambhavam-site's data/images/fonts
# from this repo's markdown and pushes the result to that repo, which
# redeploys GitHub Pages. See ganapati-sambhavam-site/tools/build_data.py
# for the actual markdown -> JSON conversion.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ganapati-sambavam (content)
        uses: actions/checkout@v4
        with:
          path: ganapati-sambavam

      - name: Checkout ganapati-sambhavam-site (site)
        uses: actions/checkout@v4
        with:
          repository: kolluruss/ganapati-sambhavam-site
          path: ganapati-sambhavam-site
          token: ${{ secrets.SITE_DEPLOY_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependency
        run: pip install pyyaml

      - name: Build site data from markdown
        working-directory: ganapati-sambhavam-site
        run: python3 tools/build_data.py

      - name: Commit and push if content changed
        working-directory: ganapati-sambhavam-site
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes — skipping deploy."
            exit 0
          fi
          git commit -m "Auto-update content from ganapati-sambavam@${GITHUB_SHA::7}"
          git push
